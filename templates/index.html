<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>my-transcriber</title>
  <style>
    :root { --bg:#f6f8fc; --card:#fff; --text:#172033; --muted:#687386; --line:#e3e8f0; --primary:#315efb; --primary-soft:#eef2ff; --danger:#c73535; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter, Pretendard, "Noto Sans KR", sans-serif; color:var(--text); background:var(--bg); }
    .wrap { max-width:1100px; margin:0 auto; padding:48px 20px 80px; }
    header { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:28px; }
    h1 { margin:0 0 8px; font-size:32px; }
    .subtitle { margin:0; color:var(--muted); }
    .status { padding:8px 12px; border:1px solid var(--line); border-radius:999px; background:#fff; font-size:13px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:24px; margin-bottom:18px; box-shadow:0 8px 30px rgba(24,39,75,.05); }
    .drop { border:2px dashed #c9d3e6; border-radius:16px; padding:42px 20px; text-align:center; transition:.2s; }
    .drop.drag { border-color:var(--primary); background:var(--primary-soft); }
    input[type=file] { display:none; }
    .button { display:inline-flex; align-items:center; justify-content:center; border:0; border-radius:12px; padding:12px 18px; font-weight:700; cursor:pointer; background:var(--primary); color:#fff; }
    .button.secondary { background:#eef1f6; color:var(--text); }
    .filename { margin:12px 0 0; color:var(--muted); font-size:14px; }
    .progress { height:12px; background:#edf0f5; border-radius:999px; overflow:hidden; }
    .bar { height:100%; width:0; background:var(--primary); transition:width .25s; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    .summary { line-height:1.7; }
    ul { padding-left:20px; }
    .transcript { white-space:pre-wrap; line-height:1.75; max-height:520px; overflow:auto; background:#fafbfe; border:1px solid var(--line); padding:18px; border-radius:12px; }
    .actions { display:flex; flex-wrap:wrap; gap:8px; }
    .hidden { display:none; }
    .error { color:var(--danger); margin-top:12px; }
    .chapter { display:flex; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); }
    @media (max-width:760px) { .grid { grid-template-columns:1fr; } header { flex-direction:column; } }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>my-transcriber</h1>
      <p class="subtitle">강의 음성 → 전사 → AI 요약 → 핵심 포인트</p>
    </div>
    <div id="ollamaStatus" class="status">Ollama 확인 중…</div>
  </header>

  <section class="card">
    <div id="drop" class="drop">
      <p><strong>MP3 / MP4 / WAV / M4A / WEBM</strong> 파일을 여기에 끌어놓으세요.</p>
      <p class="filename">최대 2GB · 전사는 로컬에서 처리됩니다.</p>
      <label class="button" for="file">파일 선택</label>
      <input id="file" type="file" accept=".mp3,.mp4,.wav,.m4a,.webm">
      <div id="selected" class="filename"></div>
      <button id="start" class="button hidden" style="margin-top:14px;">전사 시작</button>
    </div>
  </section>

  <section id="progressCard" class="card hidden">
    <strong id="statusText">준비 중…</strong>
    <div style="margin:14px 0 8px" class="progress"><div id="bar" class="bar"></div></div>
    <div id="percent">0%</div>
    <div id="error" class="error"></div>
  </section>

  <section id="result" class="hidden">
    <div class="grid">
      <div class="card">
        <h2>요약</h2>
        <div id="overview" class="summary"></div>
        <h3>핵심 내용</h3>
        <ul id="keyPoints"></ul>
        <h3>키워드</h3>
        <div id="keywords" class="summary"></div>
      </div>
      <div class="card">
        <h2>챕터</h2>
        <div id="chapters"></div>
        <h2 style="margin-top:24px">다운로드</h2>
        <div class="actions">
          <button class="button secondary" onclick="download('txt')">TXT</button>
          <button class="button secondary" onclick="download('srt')">SRT</button>
          <button class="button secondary" onclick="download('docx')">DOCX</button>
          <button class="button secondary" onclick="download('pdf')">PDF</button>
          <button class="button secondary" onclick="download('json')">JSON</button>
        </div>
      </div>
    </div>
    <div class="card">
      <h2>전사 원문</h2>
      <div id="transcript" class="transcript"></div>
    </div>
  </section>
</div>

<script>
let selectedFile = null;
let currentJob = null;

const $ = id => document.getElementById(id);
const fileInput = $("file");
const drop = $("drop");

fileInput.addEventListener("change", e => {
  selectedFile = e.target.files[0] || null;
  updateSelection();
});

["dragenter","dragover"].forEach(type => drop.addEventListener(type, e => {
  e.preventDefault(); drop.classList.add("drag");
}));
["dragleave","drop"].forEach(type => drop.addEventListener(type, e => {
  e.preventDefault(); drop.classList.remove("drag");
}));
drop.addEventListener("drop", e => {
  selectedFile = e.dataTransfer.files[0] || null;
  updateSelection();
});

function updateSelection() {
  $("selected").textContent = selectedFile
    ? `${selectedFile.name} · ${(selectedFile.size / 1024 / 1024).toFixed(1)} MB`
    : "";
  $("start").classList.toggle("hidden", !selectedFile);
}

$("start").addEventListener("click", async () => {
  if (!selectedFile) return;
  const form = new FormData();
  form.append("media", selectedFile);
  $("progressCard").classList.remove("hidden");
  $("result").classList.add("hidden");
  $("start").disabled = true;
  $("statusText").textContent = "업로드 중…";

  try {
    const res = await fetch("/api/upload", { method:"POST", body:form });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "업로드 실패");
    currentJob = data.job_id;
    poll();
  } catch (err) {
    $("error").textContent = err.message;
    $("start").disabled = false;
  }
});

async function poll() {
  const res = await fetch(`/api/jobs/${currentJob}`);
  const job = await res.json();
  if (!res.ok) {
    $("error").textContent = job.error || "상태 확인 실패";
    return;
  }

  $("bar").style.width = `${job.progress}%`;
  $("percent").textContent = `${job.progress}%`;

  const labels = {
    queued:"작업 대기 중…",
    transcribing:"음성을 텍스트로 변환하는 중…",
    summarizing:"강의 내용을 요약하는 중…",
    done:"완료되었습니다.",
    error:"오류가 발생했습니다."
  };
  $("statusText").textContent = labels[job.status] || job.status;
  $("error").textContent = job.error || "";

  if (job.status === "done") {
    renderResult(job);
    $("start").disabled = false;
    return;
  }
  if (job.status === "error") {
    $("start").disabled = false;
    return;
  }
  setTimeout(poll, 1000);
}

function renderResult(job) {
  $("result").classList.remove("hidden");
  const summary = job.summary || {};
  $("overview").textContent = summary.overview || "요약을 생성하지 못했습니다.";

  $("keyPoints").innerHTML = "";
  (summary.key_points || []).forEach(x => {
    const li = document.createElement("li");
    li.textContent = x;
    $("keyPoints").appendChild(li);
  });

  $("keywords").textContent = (summary.keywords || []).join(" · ");

  $("chapters").innerHTML = "";
  (summary.chapters || []).forEach(ch => {
    const div = document.createElement("div");
    div.className = "chapter";
    const time = document.createElement("strong");
    time.textContent = formatTime(ch.start);
    const title = document.createElement("span");
    title.textContent = ch.title;
    div.append(time, title);
    $("chapters").appendChild(div);
  });

  $("transcript").textContent = job.transcript || "";
}

function formatTime(sec) {
  const total = Math.max(0, Math.floor(Number(sec) || 0));
  const m = Math.floor(total / 60);
  const s = total % 60;
  return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

function download(kind) {
  if (currentJob) location.href = `/api/jobs/${currentJob}/export/${kind}`;
}

async function checkHealth() {
  try {
    const res = await fetch("/api/health");
    const data = await res.json();
    $("ollamaStatus").textContent = data.ollama
      ? `Ollama 연결됨 · ${data.model}`
      : "Ollama 미연결 · 전사만 사용 가능";
  } catch {
    $("ollamaStatus").textContent = "서버 상태 확인 실패";
  }
}
checkHealth();
</script>
</body>
</html>
