<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>my-transcriber</title>


    <style>

        * {
            box-sizing: border-box;
        }


        :root {

            --blue: #3563f5;

            --bg: #f5f7fb;

            --line: #e0e5ef;

            --text: #0f172a;

            --muted: #52627a;
        }


        body {

            margin: 0;

            background: var(--bg);

            color: var(--text);

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans KR",
                Arial,
                sans-serif;
        }


        .container {

            width:
                min(
                    1080px,
                    calc(100% - 32px)
                );

            margin: 0 auto;

            padding:
                10px
                0
                50px;
        }


        /* ==================================================
           Header
        ================================================== */

        .brand-row {

            display: flex;

            align-items: flex-start;

            justify-content:
                space-between;

            margin-bottom: 26px;
        }


        .brand {

            font-size: 30px;

            font-weight: 800;

            letter-spacing: -1px;

            margin-bottom: 3px;
        }


        .tagline {

            color: #62718a;

            font-size: 16px;
        }


        .server {

            border:
                1px solid #dce3ee;

            background: #fff;

            border-radius: 22px;

            padding:
                8px
                14px;

            font-size: 12px;

            color: #274da9;
        }


        /* ==================================================
           Card
        ================================================== */

        .card {

            background: #fff;

            border:
                1px solid var(--line);

            border-radius: 20px;

            box-shadow:
                0 4px 16px
                rgba(
                    27,
                    48,
                    83,
                    .04
                );
        }


        /* ==================================================
           Upload
        ================================================== */

        .upload-card {

            padding: 22px;

            margin-bottom: 18px;
        }


        .dropzone {

            min-height: 260px;

            border:
                1px dashed #cbd6e8;

            border-radius: 17px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;
        }


        .dropzone strong {

            font-size: 16px;
        }


        .hint {

            color: #64748b;

            font-size: 13px;

            margin:
                12px
                0
                4px;
        }


        input[type=file] {

            display: none;
        }


        .button {

            border: 0;

            border-radius: 11px;

            background:
                var(--blue);

            color: #fff;

            padding:
                11px
                16px;

            font-weight: 700;

            cursor: pointer;
        }


        .button:disabled {

            opacity: .55;

            cursor: not-allowed;
        }


        .file-name {

            margin:
                8px
                0
                10px;

            color: #52627a;

            font-size: 14px;
        }


        /* ==================================================
           Progress
        ================================================== */

        .progress-card {

            padding: 22px;

            margin-bottom: 18px;

            display: none;
        }


        .progress-card.show {

            display: block;
        }


        .progress-title {

            font-weight: 700;

            margin-bottom: 12px;
        }


        .progress-track {

            height: 12px;

            background: #edf1f7;

            border-radius: 999px;

            overflow: hidden;
        }


        .progress-fill {

            height: 100%;

            width: 0%;

            background:
                var(--blue);

            border-radius: 999px;

            transition:
                width .35s ease;
        }


        .progress-number {

            margin-top: 8px;

            font-size: 14px;
        }


        /* ==================================================
           Result Grid
        ================================================== */

        .result-grid {

            display: grid;

            grid-template-columns:
                1.03fr
                .97fr;

            gap: 18px;

            margin-bottom: 18px;
        }


        .result-card {

            padding: 26px;

            min-width: 0;
        }


        h2 {

            font-size: 21px;

            margin:
                0
                0
                22px;

            letter-spacing: -.4px;
        }


        h3 {

            font-size: 16px;

            margin:
                22px
                0
                12px;
        }


        /* ==================================================
           Summary
        ================================================== */

        .summary {

            line-height: 1.8;

            font-size: 14px;

            color: #24344e;

            white-space: pre-wrap;
        }


        .key-list {

            margin: 0;

            padding-left: 21px;

            color: #24344e;

            line-height: 1.75;

            font-size: 14px;
        }


        .keyword-line {

            color: #24344e;

            line-height: 1.8;

            font-size: 14px;

            word-break: keep-all;
        }


        /* ==================================================
           Chapters
        ================================================== */

        .chapters {

            display: flex;

            flex-direction: column;

            gap: 0;
        }


        .chapter {

            display: flex;

            gap: 13px;

            align-items: center;

            padding:
                11px
                0;

            border-bottom:
                1px solid #e7ebf2;

            cursor: pointer;
        }


        .chapter:first-child {

            padding-top: 0;
        }


        .chapter-time {

            font-weight: 800;

            font-size: 14px;

            min-width: 50px;
        }


        .chapter-title {

            font-size: 14px;

            color: #1f2f49;
        }


        /* ==================================================
           Downloads
        ================================================== */

        .downloads {

            display: flex;

            flex-wrap: wrap;

            gap: 8px;

            margin-top: 20px;
        }


        .download {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-width: 60px;

            padding:
                10px
                13px;

            border-radius: 11px;

            background: #eef2f7;

            color: #14213a;

            text-decoration: none;

            font-size: 13px;

            font-weight: 700;
        }


        .download:hover {

            background: #e3e9f2;
        }


        /* ==================================================
           Transcript
        ================================================== */

        .transcript-card {

            padding: 26px;
        }


        .transcript {

            max-height: 500px;

            overflow: auto;

            border:
                1px solid #e3e8f0;

            border-radius: 12px;

            background: #fbfcfe;

            padding: 17px;

            line-height: 1.75;

            font-size: 14px;

            color: #24344e;

            white-space: pre-wrap;
        }


        /* ==================================================
           Mobile
        ================================================== */

        @media (
            max-width: 760px
        ) {

            .result-grid {

                grid-template-columns:
                    1fr;
            }


            .brand {

                font-size: 25px;
            }


            .container {

                width:
                    min(
                        100% - 20px,
                        1080px
                    );
            }
        }

    </style>

</head>


<body>


<div class="container">


    <!-- ==================================================
         Header
    ================================================== -->

    <div class="brand-row">

        <div>

            <div class="brand">
                my-transcriber
            </div>

            <div class="tagline">
                강의 음성 → 전사 → AI 요약 → 핵심 포인트
            </div>

        </div>


        <div class="server">
            서버 정상 작동 중
        </div>

    </div>


    <!-- ==================================================
         Upload
    ================================================== -->

    <section class="card upload-card">

        <div class="dropzone">

            <strong>
                MP3 / MP4 / WAV / M4A / WEBM
                파일을 여기에 끌어놓으세요.
            </strong>


            <div class="hint">
                최대 2GB · 전사는 로컬에서 처리됩니다.
            </div>


            <label
                class="button"
                for="media"
            >
                파일 선택
            </label>


            <input
                id="media"
                type="file"
                accept=".mp3,.mp4,.wav,.m4a,.webm"
            >


            <div
                id="file-name"
                class="file-name"
            >
                파일을 선택해주세요.
            </div>


            <button
                id="start"
                class="button"
                disabled
            >
                전사 시작
            </button>

        </div>

    </section>


    <!-- ==================================================
         Progress
    ================================================== -->

    <section
        id="progress-card"
        class="card progress-card"
    >

        <div
            id="status"
            class="progress-title"
        >
            전사 준비 중...
        </div>


        <div class="progress-track">

            <div
                id="progress-fill"
                class="progress-fill"
            ></div>

        </div>


        <div
            id="progress-number"
            class="progress-number"
        >
            0%
        </div>

    </section>


    <!-- ==================================================
         Results
    ================================================== -->

    <div
        id="results"
        style="display:none;"
    >


        <div class="result-grid">


            <!-- ==========================================
                 Left
            =========================================== -->

            <section class="card result-card">

                <h2>
                    요약
                </h2>


                <div
                    id="summary"
                    class="summary"
                ></div>


                <h3>
                    핵심 내용
                </h3>


                <ul
                    id="key-points"
                    class="key-list"
                ></ul>


                <h3>
                    키워드
                </h3>


                <div
                    id="keywords"
                    class="keyword-line"
                ></div>

            </section>


            <!-- ==========================================
                 Right
            =========================================== -->

            <section class="card result-card">

                <h2>
                    챕터
                </h2>


                <div
                    id="chapters"
                    class="chapters"
                ></div>


                <h2
                    style="
                        margin-top:24px;
                        margin-bottom:12px;
                    "
                >
                    다운로드
                </h2>


                <div class="downloads">

                    <a
                        class="download"
                        href="/download/txt"
                    >
                        TXT
                    </a>


                    <a
                        class="download"
                        href="/download/srt"
                    >
                        SRT
                    </a>


                    <a
                        class="download"
                        href="/download/docx"
                    >
                        DOCX
                    </a>


                    <a
                        class="download"
                        href="/download/pdf"
                    >
                        PDF
                    </a>


                    <a
                        class="download"
                        href="/download/json"
                    >
                        JSON
                    </a>

                </div>

            </section>

        </div>


        <!-- ==================================================
             Transcript
        ================================================== -->

        <section
            class="card transcript-card"
        >

            <h2>
                전사 원문
            </h2>


            <div
                id="transcript"
                class="transcript"
            ></div>

        </section>

    </div>

</div>


<script>


// ============================================================
// DOM
// ============================================================

const media =
    document.getElementById(
        "media"
    );


const fileName =
    document.getElementById(
        "file-name"
    );


const start =
    document.getElementById(
        "start"
    );


const progressCard =
    document.getElementById(
        "progress-card"
    );


const status =
    document.getElementById(
        "status"
    );


const progressFill =
    document.getElementById(
        "progress-fill"
    );


const progressNumber =
    document.getElementById(
        "progress-number"
    );


const results =
    document.getElementById(
        "results"
    );


// ============================================================
// 파일 선택
// ============================================================

media.addEventListener(
    "change",
    () => {

        const file =
            media.files[0];


        if (!file) {

            fileName.textContent =
                "파일을 선택해주세요.";

            start.disabled = true;

            return;
        }


        const mb =
            (
                file.size
                / 1024
                / 1024
            ).toFixed(1);


        fileName.textContent =
            `${file.name} · ${mb} MB`;


        start.disabled = false;
    }
);


// ============================================================
// 전사 시작
// ============================================================

start.addEventListener(
    "click",
    async () => {

        const file =
            media.files[0];


        if (!file) {
            return;
        }


        start.disabled = true;

        progressCard.classList.add(
            "show"
        );


        results.style.display =
            "none";


        setProgress(
            0,
            "업로드 중..."
        );


        const formData =
            new FormData();


        formData.append(
            "media",
            file
        );


        try {

            const response =
                await fetch(
                    "/api/upload",
                    {
                        method: "POST",

                        body: formData
                    }
                );


            const data =
                await response.json();


            if (
                !response.ok
                || !data.ok
            ) {

                throw new Error(
                    data.error
                    || "업로드에 실패했습니다."
                );
            }


            pollProgress();


        } catch (error) {

            setProgress(
                0,
                "오류가 발생했습니다."
            );


            status.textContent =
                error.message;


            start.disabled =
                false;
        }
    }
);


// ============================================================
// 진행률 표시
// ============================================================

function setProgress(
    percent,
    message
) {

    progressFill.style.width =
        `${percent}%`;


    progressNumber.textContent =
        `${percent}%`;


    status.textContent =
        message;
}


// ============================================================
// 진행률 Polling
// ============================================================

function pollProgress() {

    const timer =
        setInterval(
            async () => {

                try {

                    const response =
                        await fetch(
                            "/api/progress"
                        );


                    const data =
                        await response.json();


                    setProgress(
                        Number(
                            data.percent || 0
                        ),
                        data.stage
                        || "처리 중..."
                    );


                    // 완료
                    if (
                        data.status
                        === "done"
                    ) {

                        clearInterval(
                            timer
                        );


                        setProgress(
                            100,
                            "완료되었습니다."
                        );


                        await loadResult();


                        start.disabled =
                            false;


                        return;
                    }


                    // 오류
                    if (
                        data.status
                        === "error"
                    ) {

                        clearInterval(
                            timer
                        );


                        status.textContent =
                            data.error
                            || "처리 중 오류가 발생했습니다.";


                        start.disabled =
                            false;
                    }


                } catch (error) {

                    clearInterval(
                        timer
                    );


                    status.textContent =
                        "진행률 확인에 실패했습니다.";


                    start.disabled =
                        false;
                }

            },
            1000
        );
}


// ============================================================
// 결과 불러오기
// ============================================================

async function loadResult() {

    const response =
        await fetch(
            "/api/result"
        );


    const data =
        await response.json();


    renderResult(
        data
    );
}


// ============================================================
// 시간 표시
// ============================================================

function formatTime(
    seconds
) {

    const total =
        Math.max(
            0,
            Math.floor(
                Number(
                    seconds || 0
                )
            )
        );


    const h =
        Math.floor(
            total / 3600
        );


    const m =
        Math.floor(
            (total % 3600) / 60
        );


    const s =
        total % 60;


    return [

        String(h).padStart(
            2,
            "0"
        ),

        String(m).padStart(
            2,
            "0"
        ),

        String(s).padStart(
            2,
            "0"
        )

    ].join(":");
}


// ============================================================
// 결과 렌더링
// ============================================================

function renderResult(
    data
) {

    results.style.display =
        "block";


    // --------------------------------------------------------
    // 요약
    // --------------------------------------------------------

    document.getElementById(
        "summary"
    ).textContent =
        data.summary
        || "요약이 없습니다.";


    // --------------------------------------------------------
    // 핵심 내용
    // --------------------------------------------------------

    const keyPoints =
        document.getElementById(
            "key-points"
        );


    keyPoints.innerHTML =
        "";


    (
        data.key_points
        || []
    ).forEach(
        point => {

            const li =
                document.createElement(
                    "li"
                );


            li.textContent =
                point;


            keyPoints.appendChild(
                li
            );
        }
    );


    // --------------------------------------------------------
    // 키워드
    // --------------------------------------------------------

    document.getElementById(
        "keywords"
    ).textContent =
        (
            data.keywords
            || []
        ).join(
            " · "
        );


    // --------------------------------------------------------
    // 챕터
    // --------------------------------------------------------

    const chapters =
        document.getElementById(
            "chapters"
        );


    chapters.innerHTML =
        "";


    (
        data.chapters
        || []
    ).forEach(
        chapter => {

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "chapter";


            row.innerHTML =
                `
                <span class="chapter-time">
                    ${formatTime(
                        chapter.start
                    )}
                </span>

                <span class="chapter-title"></span>
                `;


            row.querySelector(
                ".chapter-title"
            ).textContent =
                chapter.title
                || "챕터";


            row.addEventListener(
                "click",
                () => {

                    scrollTranscriptTo(
                        Number(
                            chapter.start
                            || 0
                        ),
                        data.segments
                        || []
                    );
                }
            );


            chapters.appendChild(
                row
            );
        }
    );


    // --------------------------------------------------------
    // 전사 원문
    // --------------------------------------------------------

    const transcript =
        document.getElementById(
            "transcript"
        );


    transcript.textContent = (

        data.segments
        || []

    ).map(

        segment =>

            `[${formatTime(
                segment.start
            )}] ${segment.text}`

    ).join(
        "\n"
    );
}


// ============================================================
// 챕터 클릭 → 전사 위치
// ============================================================

function scrollTranscriptTo(
    start,
    segments
) {

    const box =
        document.getElementById(
            "transcript"
        );


    const index =
        segments.findIndex(
            segment =>
                Number(
                    segment.start
                    || 0
                )
                >= start
        );


    if (index < 0) {
        return;
    }


    const lineHeight =
        1.75 * 14;


    box.scrollTop =
        index * lineHeight;
}


// ============================================================
// 새로고침 후 마지막 결과 복원
// ============================================================

(async function restore() {

    try {

        const response =
            await fetch(
                "/api/progress"
            );


        const data =
            await response.json();


        if (
            data.status
            === "done"
        ) {

            progressCard.classList.add(
                "show"
            );


            setProgress(
                100,
                "완료되었습니다."
            );


            await loadResult();
        }


    } catch (error) {

        // 초기 페이지에서는 무시
    }

})();

</script>


</body>

</html>
